# Scope rules — NOT YET ENFORCED in code.
# Future scope enforcement should be explicit before command execution.
# CTF/lab targets typically use RFC1918 ranges; review blocks before enabling.

allowed_targets:
  # Add targets here explicitly, or leave empty to allow all (with blocked exclusions)
  # - example.com
  # - 10.10.10.0/24


limits:
  max_rate: 100  # packets/second for masscan
  max_threads: 3  # parallel targets
  allow_service_interaction: true  # set true to allow SMB/FTP/MySQL checks
  allow_active_scan: true
